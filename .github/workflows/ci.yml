name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  flutter-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: packages/virtual_queue_core
        run: flutter pub get
      - name: Run tests
        working-directory: packages/virtual_queue_core
        run: flutter test

  flutter-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: virtual_queue_phone
        run: flutter pub get
      - name: Run tests
        working-directory: virtual_queue_phone
        run: flutter test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        working-directory: virtual-queue-back
        run: sh ./mvnw -B test
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: virtual-queue-back/target/surefire-reports/
