spring.application.name=virtual-queue-back
server.port=8080

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_MAX_SIZE:5}

jwt.secret=${JWT_SECRET}
jwt.access-ttl=${JWT_ACCESS_TTL:900}
jwt.refresh-ttl=${JWT_REFRESH_TTL:604800}

firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.staff-registration.pepper=${STAFF_REGISTRATION_KEY_PEPPER}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
