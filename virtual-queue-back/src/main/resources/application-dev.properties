spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

# Si el esquema ya fue creado manualmente en Supabase (V1 + V2), Flyway solo registra el baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

app.staff-registration.pepper=${STAFF_REGISTRATION_KEY_PEPPER:dev-staff-registration-pepper-change-me-32chars}
